<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Untitled</title>
  <link rel="stylesheet" href="../kempo-vars.css" />
  <link rel="stylesheet" href="../kempo.min.css" />
  <script src="../init.js"></script>
  <script>
    window.litDisableBundleWarning = true;
    try{ document.documentElement.setAttribute('theme', localStorage.getItem('theme') || 'auto'); }catch(e){}
  </script>
  
</head>
<body>
  
    <k-aside id="aside4" state="offscreen">
    <p>Push Sidebar Content</p>
  </k-aside>
  <k-main>
    <button id="toggle4">Toggle Sidebar</button>
    <p>This content shifts when the aside is visible.</p>
  </k-main>
  
  
    <script>
    document.getElementById('toggle4').addEventListener('click',()=>{
      document.getElementById('aside4').toggle();
    });
  </script>
    <script type="module" src="../src/components/Aside.js"></script>
    <script type="module" src="../src/components/Main.js"></script>
  
</body>
</html>
