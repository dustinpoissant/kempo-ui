<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aside Menu Example</title>
  <link rel="stylesheet" href="../kempo-vars.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo.min.css" />
  <script>window.litDisableBundleWarning = true;</script>
  
    <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
  </style>
    <script type="module">
    import theme from '../src/utils/theme.js';
    theme.init();
  </script>
    <script type="module" src="../src/components/Aside.js"></script>
    <script type="module" src="../src/components/Main.js"></script>
  
</head>
<body>
  
    <k-aside main="push" state="expanded" style="--aside_padding: 0;">
    <k-aside-toggle><h5 class="m0">Kempo</h5></k-aside-toggle>
    <k-aside-item icon="cards" href="#">Dashboard</k-aside-item>
    <k-aside-menu icon="folder" label="Projects">
      <k-aside-item href="#">Website Redesign</k-aside-item>
      <k-aside-item href="#">Mobile App</k-aside-item>
    </k-aside-menu>
    <k-aside-menu icon="settings" label="Settings">
      <k-aside-item href="#">General</k-aside-item>
      <k-aside-item href="#">Security</k-aside-item>
    </k-aside-menu>
  </k-aside>
  <k-main>
    <h2>Main Content</h2>
    <p>Click menu headers to expand sub-items. Collapse the aside to see menus fold.</p>
  </k-main>
  
  
</body>
</html>
