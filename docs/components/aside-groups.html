<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aside Groups Example</title>
  <link rel="stylesheet" href="../kempo-vars.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo.min.css" />
  <script>window.litDisableBundleWarning = true;</script>
  
    <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
  </style>
    <script type="module">
    import theme from '../src/utils/theme.js';
    theme.init();
  </script>
    <script type="module" src="../src/components/Aside.js"></script>
    <script type="module" src="../src/components/Main.js"></script>
  
</head>
<body>
  
    <k-aside main="push" state="expanded" style="--aside_padding: 0;" group-icons='{"Commerce":"folder-open"}'>
    <k-aside-toggle><h5 class="m0">Kempo</h5></k-aside-toggle>
    <k-aside-item icon="cards" href="#">Dashboard</k-aside-item>
    <k-aside-item group="Commerce" icon="edit" href="#">Products</k-aside-item>
    <k-aside-item group="Commerce" icon="edit" href="#">Inventory</k-aside-item>
    <k-aside-item group="Content" icon="edit" href="#">Blog</k-aside-item>
    <k-aside-item icon="settings" href="#">Settings</k-aside-item>
  </k-aside>
  <k-main>
    <h2>Main Content</h2>
    <p>Products and Inventory share the group <code>Commerce</code>, so they are in a menu. Blog is the only item in <code>Content</code>, so it stays a normal item.</p>
    <button id="add">Add a second item to Content</button>
    <script>
      document.getElementById('add').addEventListener('click', () => {
        const item = document.createElement('k-aside-item');
        item.setAttribute('group', 'Content');
        item.setAttribute('icon', 'edit');
        item.setAttribute('href', '#');
        item.textContent = 'Media';
        document.querySelector('k-aside').append(item);
      });
    </script>
  </k-main>
  
  
</body>
</html>
