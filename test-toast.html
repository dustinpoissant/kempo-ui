<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Test</title>
  <link rel="stylesheet" href="src/kempo-vars.css">
  <style>
    :root {
      --c_bg: #ffffff;
      --tc: #000000;
      --spacer: 1rem;
      --radius: 0.375rem;
      --c_success: #16a34a;
      --c_warning: #f59e0b;
      --c_danger: #dc2626;
      --tc_on_success: #166534;
      --tc_on_warning: #92400e;
      --tc_on_danger: #991b1b;
      --animation_ms: 300ms;
      --drop_shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: var(--c_bg, #ffffff);
      color: var(--tc, #000000);
    }
    button {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.25rem;
      background: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <h1>Toast Component Test</h1>
  
  <div style="margin-bottom: 2rem;">
    <h2>Icon Color Test</h2>
    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
      <span style="color: #166534;">Success color:</span>
      <k-icon name="check" style="color: inherit;"></k-icon>
      <k-icon name="check"></k-icon>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
      <span style="color: #92400e;">Warning color:</span>
      <k-icon name="warning" style="color: inherit;"></k-icon>
      <k-icon name="warning"></k-icon>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
      <span style="color: #991b1b;">Error color:</span>
      <k-icon name="error" style="color: inherit;"></k-icon>
      <k-icon name="error"></k-icon>
    </div>
  </div>
  
  <button onclick="testToast()">Test Basic Toast</button>
  <button onclick="testSuccessToast()">Success Toast</button>
  <button onclick="testWarningToast()">Warning Toast</button>
  <button onclick="testErrorToast()">Error Toast</button>
  <button onclick="testManualToast()">Manual Toast</button>

  <script type="module">
    import Toast from './src/components/Toast.js';
    import Toggle from './src/components/Toggle.js';
    import ShadowComponent from './src/components/ShadowComponent.js';
    
    // Configure the stylesheet path for ShadowComponent
    ShadowComponent.stylesheetPath = './docs/kempo.min.css';
    
    window.Toast = Toast;
    
    window.testToast = function() {
      console.log('Testing basic toast...');
      try {
        const toast = Toast.create('Hello World', { timeout: 5000 });
        console.log('Toast created:', toast);
        console.log('Toast opened:', toast.opened);
        console.log('Toast in DOM:', document.body.contains(toast));
      } catch (error) {
        console.error('Error creating toast:', error);
      }
    };
    
    window.testSuccessToast = function() {
      console.log('Testing success toast...');
      try {
        const toast = Toast.success('Success! Operation completed successfully.');
        console.log('Success toast created:', toast);
      } catch (error) {
        console.error('Error creating success toast:', error);
      }
    };
    
    window.testWarningToast = function() {
      console.log('Testing warning toast...');
      try {
        const toast = Toast.warning('Warning! Please check your input.');
        console.log('Warning toast created:', toast);
      } catch (error) {
        console.error('Error creating warning toast:', error);
      }
    };
    
    window.testErrorToast = function() {
      console.log('Testing error toast...');
      try {
        const toast = Toast.error('Error! Something went wrong.');
        console.log('Error toast created:', toast);
      } catch (error) {
        console.error('Error creating error toast:', error);
      }
    };
    
    window.testManualToast = function() {
      console.log('Testing manual toast...');
      try {
        const toast = document.createElement('k-toast');
        toast.innerHTML = 'Manual toast content';
        toast.timeout = 5000;
        document.body.appendChild(toast);
        console.log('Manual toast created:', toast);
        toast.open();
        console.log('Manual toast opened:', toast.opened);
      } catch (error) {
        console.error('Error creating manual toast:', error);
      }
    };
  </script>
</body>
</html>
