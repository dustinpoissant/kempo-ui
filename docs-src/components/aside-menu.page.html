<page template="bare" title="Aside Menu Example">
  <content location="head">
    <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
  </style>
    <script type="module">
    import theme from '{{pathToRoot}}src/utils/theme.js';
    theme.init();
  </script>
    <script type="module" src="{{pathToRoot}}src/components/Aside.js"></script>
    <script type="module" src="{{pathToRoot}}src/components/Main.js"></script>
  </content>
  <content>
    <k-aside main="push" state="expanded" style="--aside_padding: 0;">
    <k-aside-toggle><h5 class="m0">Kempo</h5></k-aside-toggle>
    <k-aside-item icon="cards" href="#">Dashboard</k-aside-item>
    <k-aside-menu icon="folder" label="Projects">
      <k-aside-item href="#">Website Redesign</k-aside-item>
      <k-aside-item href="#">Mobile App</k-aside-item>
    </k-aside-menu>
    <k-aside-menu icon="settings" label="Settings">
      <k-aside-item href="#">General</k-aside-item>
      <k-aside-item href="#">Security</k-aside-item>
    </k-aside-menu>
  </k-aside>
  <k-main>
    <h2>Main Content</h2>
    <p>Click menu headers to expand sub-items. Collapse the aside to see menus fold.</p>
  </k-main>
  </content>
</page>
