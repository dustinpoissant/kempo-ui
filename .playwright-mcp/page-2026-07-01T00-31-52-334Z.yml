      - paragraph [ref=f22e90]:
        - text: A
        - code [ref=f22e91]: <video>
        - text: wrapper with
        - strong [ref=f22e92]: no native controls
        - text: . Build your own toolbar by slotting in the bundled
        - code [ref=f22e93]: kc-vid-*
        - text: controls (or your own custom elements) — exactly the same slotted-control pattern used by
        - link "Table" [ref=f22e94] [cursor=pointer]:
          - /url: ../components/table.html
        - text: ","
        - link "Pagination" [ref=f22e95] [cursor=pointer]:
          - /url: ../components/pagination.html
        - text: ", and"
        - link "Markdown Editor" [ref=f22e96] [cursor=pointer]:
          - /url: ../components/markdown-editor.html
        - text: . Use the
        - code [ref=f22e97]: controls
        - text: attribute for a preconfigured toolbar, or mix and match.
      - paragraph [ref=f22e98]:
        - text: Because there's no native
        - code [ref=f22e99]: <input type="range">
        - text: seek bar, there's nothing for the browser to give keyboard focus to when the user drags it — so a page-level
        - code [ref=f22e100]: keydown
        - text: listener (e.g. space bar to play/pause) keeps working after the user interacts with the player. See
        - link "Page-Level Keyboard Shortcut" [ref=f22e101] [cursor=pointer]:
          - /url: "#keyboardShortcut"
        - text: below.
      - heading "Basic Usage" [level=3] [ref=f22e102]:
        - link "Basic Usage" [ref=f22e103] [cursor=pointer]:
          - /url: "#basicUsage"
      - paragraph [ref=f22e104]:
        - text: With no
        - code [ref=f22e105]: controls
        - text: attribute and nothing slotted in,
        - code [ref=f22e106]: k-video
        - text: renders just the bare video — useful when you want full control over the UI, or are driving playback entirely from your own buttons.
