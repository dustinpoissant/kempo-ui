        - link "Manual Controls" [ref=f25e128] [cursor=pointer]:
          - /url: "#manualControls"
      - paragraph [ref=f25e129]:
        - text: Slot any combination of built-in controls directly inside
        - code [ref=f25e130]: <k-video>
        - text: ", into one of three regions: unnamed (default) slot content renders in a control bar overlaid at the"
        - strong [ref=f25e131]: bottom
        - text: of the player,
        - code [ref=f25e132]: slot="top"
        - text: renders above the video, and
        - code [ref=f25e133]: slot="center"
        - text: renders centered over the video — the last is where
        - code [ref=f25e134]: <kc-vid-play-big>
        - text: normally goes.
