        - text: of the player,
        - code [ref=f24e132]: slot="top"
        - text: renders above the video, and
        - code [ref=f24e133]: slot="center"
        - text: renders centered over the video — the last is where
        - code [ref=f24e134]: <kc-vid-play-big>
        - text: normally goes.
